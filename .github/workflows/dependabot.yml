version: 2

updates:
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      ocean-models:
        patterns:
          - "OceanBioME"
          - "Oceananigans"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
