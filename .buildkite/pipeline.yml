steps:
  - label: ":gpu: Julia 1.10 GPU smoke tests"
    key: "gpu-tests"
    agents:
      queue: "GPU"
    env:
      # Avoid full-environment precompilation on the T4 runner.
      JULIA_PKG_PRECOMPILE_AUTO: "0"
      JULIA_NUM_PRECOMPILE_TASKS: "2"
    commands:
      - nvidia-smi
      - julia --version
      # Julia 1.10 requires explicitly developing the local checkout into this project.
      - julia --project=test/gpu --color=yes -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate(); Pkg.update(["OceanBioME", "Oceananigans"]); Pkg.status(["Agate", "OceanBioME", "Oceananigans"])'
      - julia --project=test/gpu --color=yes test/gpu/compat_resolution.jl
      - julia --project=test/gpu --color=yes test/gpu/smoke.jl
    timeout_in_minutes: 60
