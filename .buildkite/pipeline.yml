steps:
  - label: ":gpu: Julia 1.10 GPU tests"
    key: "gpu-tests"
    agents:
      queue: "GPU"
    env:
      AGATE_TEST_CUDA: "1"
    commands:
      - nvidia-smi
      - julia --version
      - julia --project=. --color=yes -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - julia --project=benchmark --color=yes -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
      - julia --project=benchmark --color=yes benchmark/grazing_scaling.jl --gpu --quick
    timeout_in_minutes: 30
